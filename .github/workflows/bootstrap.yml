name: Install SEED-0 source
on:
  push:
    paths:
      - seed-code-payload.b64
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the original source
        run: |
          set -euo pipefail
          base64 --decode seed-code-payload.b64 > seed-package.tar.gz
          mkdir -p /tmp/seed-source
          tar -xzf seed-package.tar.gz -C /tmp/seed-source
          test -s /tmp/seed-source/index.html
          test -s /tmp/seed-source/src/model.js
          cp -a /tmp/seed-source/. .
          rm -f seed-code-payload.b64 seed-package.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SEED-0 neural prototype
        run: npm test
      - name: Commit verified project files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import and verify SEED-0 neural prototype'
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Prepare website-only artifact
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp src/*.js src/*.css _site/src/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4