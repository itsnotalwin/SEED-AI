name: Test and deploy SEED
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify website files
        run: test -s index.html && test -s src/model.js && test -s src/brain.js && test -s src/app.js && test -s src/style.css
      - name: Verify observatory files
        run: test -s observatory/index.html && test -s observatory/styles.css && test -s observatory/app.js && test -s observatory/data-loader.js && test -s observatory/model.js && test -s observatory/views/overview.js && test -s observatory/views/evolution.js && test -s observatory/views/arena.js && test -s observatory/views/learning.js && test -s observatory/views/research.js && test -s observatory/views/model-lab.js && test -s observatory/views/interact.js && test -s observatory/views/memory.js && test -s observatory/public/observatory/v1.json
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public website
        run: |
          mkdir -p _site/src
          cp index.html _site/index.html
          cp src/*.js src/*.css _site/src/
          mkdir -p _site/observatory
          cp -r observatory/* _site/observatory/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
